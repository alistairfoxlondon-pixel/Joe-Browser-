name: Release

# Builds JoeBrowser.exe and JoeBrowserSetup.exe on a real Windows runner and publishes them.
#
# This exists because the EXE has to be produced by a Windows toolchain: the app is WinForms on
# .NET Framework 4.8 and links against the machine's GDI and Win32 APIs, so it cannot be
# cross-built honestly from a Linux container. Pushing a tag such as v1.3.0 runs this workflow,
# smoke-tests the binary it just made, and attaches both files to the release with the exact
# names the README links to (releases/latest/download/JoeBrowserSetup.exe).
#
# A push to master also builds and smoke-tests both binaries but publishes nothing, so a broken
# build is visible before a release tag is cut, and only a tag can create a release.

on:
  push:
    branches: [master, 'arena/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Read the version from the source
        id: ver
        shell: pwsh
        run: |
          # The one place the version is allowed to live is AssemblyInfo.cs; everything else
          # (asset names, release title, the tag check) is derived from it, so the two cannot
          # disagree at release time.
          $text = Get-Content src/AssemblyInfo.cs -Raw
          if ($text -notmatch 'AssemblyInformationalVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)') {
            throw 'Could not read AssemblyInformationalVersion from src/AssemblyInfo.cs'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Locate the SDK compiler
        id: csc
        shell: pwsh
        run: |
          # The repo builds with csc.exe directly (no project file, no NuGet), which is why the
          # build scripts take a -Csc path. The SDK ships Roslyn, so that path is satisfied here.
          $base = (& dotnet --info | Out-String)
          if ($base -notmatch 'Base Path:\s*(.+)') { throw 'Could not find the dotnet base path' }
          $roslyn = Join-Path $Matches[1].Trim() 'Roslyn\bincore\csc.dll'
          if (-not (Test-Path $roslyn)) { throw "No Roslyn compiler at $roslyn" }
          "path=$roslyn" >> $env:GITHUB_OUTPUT

          # Both build scripts take -Csc and invoke it as csc, so one forwarding wrapper is
          # created here and reused. It lives in RUNNER_TEMP and never reaches the repo.
          #
          # The SDK's Roslyn ships no csc.rsp, so a compile that passes no /r: switch resolves
          # nothing at all - not even System.Object - and fails with CS0518. The wrapper names
          # the framework assemblies explicitly, limited to the ones a WinForms app needs so
          # that type forwarding from 4.8 reference assemblies still lines up.
          $fw = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $refs = @('mscorlib.dll', 'System.dll', 'System.Core.dll', 'System.Drawing.dll',
                    'System.Windows.Forms.dll', 'System.Configuration.dll', 'System.Web.Extensions.dll',
                    'System.Security.dll', 'System.IO.Compression.dll',
                    'System.IO.Compression.FileSystem.dll') |
              ForEach-Object { Join-Path $fw $_ } |
              Where-Object { Test-Path $_ } |
              ForEach-Object { "/r:`"$_`"" }
          $wrapper = Join-Path $env:RUNNER_TEMP 'csc.cmd'
          $body = "@echo off`r`ndotnet `"$roslyn`" $($refs -join ' ') %*"
          Set-Content -Path $wrapper -Value $body -Encoding ASCII
          Write-Host "Wrapper: $body"
          "wrapper=$wrapper" >> $env:GITHUB_OUTPUT
          Write-Host "Compiler: $roslyn"

      - name: Smoke-test the compiler
        shell: pwsh
        run: |
          # Compiles a three-line program through the same wrapper the build uses, so a broken
          # wrapper, a missing dotnet or a missing reference assembly is reported here instead
          # of as an unexplained failure halfway through the real build.
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'probe') | Out-Null
          $probe = Join-Path $env:RUNNER_TEMP 'probe\probe.cs'
          'class P { static void Main() { } }' | Set-Content -Path $probe -Encoding ASCII
          $exe = Join-Path $env:RUNNER_TEMP 'probe\probe.exe'
          & '${{ steps.csc.outputs.wrapper }}' /nologo /target:exe /out:$exe $probe
          if ($LASTEXITCODE -ne 0) { throw "The SDK compiler could not build a trivial program (exit $LASTEXITCODE)" }
          if (-not (Test-Path $exe)) { throw "The SDK compiler reported success but produced no output" }
          Write-Host "Compiler smoke test passed: $((Get-Item $exe).Length) bytes"

      - name: Build JoeBrowser.exe
        shell: pwsh
        run: |
          # Wrapped so that a compiler error becomes a readable annotation rather than a bare
          # exit code 1. build.ps1 drives csc directly; the wrapper forwards to the SDK's Roslyn.
          .\.github\workflows\run-step.ps1 -Script build\build.ps1 -ScriptArgs @('-Csc', '${{ steps.csc.outputs.wrapper }}')

      - name: Build JoeBrowserSetup.exe
        shell: pwsh
        run: |
          # setup.ps1 takes the same -Csc parameter, so nothing has to be written into the repo.
          .\.github\workflows\run-step.ps1 -Script build\setup.ps1 -ScriptArgs @('-Csc', '${{ steps.csc.outputs.wrapper }}')

      - name: Verify the binaries
        shell: pwsh
        run: |
          # Routed through run-step.ps1 so that whatever this check prints on the way to failing
          # becomes a readable annotation: the raw log is not reachable from here.
          ./.github/workflows/run-step.ps1 -Script .github/workflows/verify-binaries.ps1 -ScriptArgs @('-Version', '${{ steps.ver.outputs.version }}')

      - name: Install, run and remove the installer's result
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Only on a tag: this writes to the runner's profile and registry, and it is the last
          # thing worth proving before a release goes out. Branches keep to the cheaper checks.
          ./.github/workflows/run-step.ps1 -Script .github/workflows/install-test.ps1 -ScriptArgs @('-Version', '${{ steps.ver.outputs.version }}')

      - name: Stage the release assets
        shell: pwsh
        run: |
          # Flat, predictable asset names: the README links to releases/latest/download/<name>,
          # so a renamed asset silently breaks every download link on the page.
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item 'dist\JoeBrowser.exe'      'out\JoeBrowser.exe'      -Force
          Copy-Item 'dist\JoeBrowserSetup.exe' 'out\JoeBrowserSetup.exe' -Force
          # Both files are listed: someone who downloads the portable JoeBrowser.exe has the
          # same reason to verify it as someone who runs the installer.
          $lines = foreach ($n in @('JoeBrowser.exe', 'JoeBrowserSetup.exe')) {
            $h = Get-FileHash (Join-Path 'out' $n) -Algorithm SHA256
            "$($h.Hash.ToLower())  $n"
          }
          $lines | Set-Content 'out\SHA256.txt' -Encoding ASCII
          Get-Content 'out\SHA256.txt'
          Get-ChildItem out | Format-Table Name, Length

      - name: Check the tag matches the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne '${{ steps.ver.outputs.tag }}') {
            throw "Tag ${{ github.ref_name }} does not match the version in AssemblyInfo.cs (${{ steps.ver.outputs.version }}). Bump the source, or move the tag."
          }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: Joe Browser ${{ steps.ver.outputs.version }} (Windows)
          tag_name: ${{ github.ref_name }}
          files: |
            out/JoeBrowser.exe
            out/JoeBrowserSetup.exe
            out/SHA256.txt
          body: |
            ## Joe Browser ${{ steps.ver.outputs.version }}

            **Download and run `JoeBrowserSetup.exe`.** Windows 10 or 11, 64 bit. The installer
            is per user, so there is no administrator prompt and nothing is written outside your
            profile. `JoeBrowser.exe` is the same app as one portable file: run it with
            `--portable` if you would rather not install.

            ### In this build

            **The type is Telenor.** The whole interface is now set in the Telenor brand face,
            bundled inside the executable so every install shows it, and the long-standing
            "everything is one size too small" defect is fixed at the root: a conversion error
            in the font builder shrank every requested size to 75% of itself, so a "16 px" body
            really drew 12 px. Every size is now the size it says it is, fields and buttons are
            taller to match, and icons are scaled up across the interface.

            **Section switching no longer flashes.** A page switch composed its first frame a
            few messages late, so the previous header band could be seen over the new page for
            one frame - the "broken CSS" effect. The frame is now composed on the spot, and the
            language coverage check means non-Latin interface languages fall back to the system
            face instead of drawing boxes.

            **The interface moves.** Buttons, icon buttons and switches tween between their
            states on a shared animation clock, toasts arrive with a small slide, and the page
            scrollbar fades to a quiet line when the page stops moving and comes back the
            moment it scrolls.

            **The included Chrome Web Store pair is fixed end to end.** The background
            download now reports to the window the moment it lands (no more "waiting for
            download" that never changes), a half-written download retries on the next start,
            the pair loads only for Chrome, Brave and Chromium - never Edge or Firefox - and
            removing one from its own row keeps it removed.

            **Paste as human is visible again.** On builds where the unpacked extension cannot
            load, the page draws its own "Paste as human" entry above the native menu when
            you right-click a field - and every Ctrl+V was already typing like a person.

            **Proxies.** Adding one accepts IPv6, keeps credentials typed in a masked field,
            and tells you when the write failed instead of claiming "saved". Proxy rows have a
            right-click menu that copies the full address, the host, the username, the password
            or the last checked IP. A proxy test can no longer pass through a dead proxy to
            your real connection and report it as Working, and a running profile without a
            relay is no longer told its proxy changed live.

            **The Account page is rebuilt**: a readable member-since date, a plan card without
            the filler line, a security card that says each protection once, a new workspace
            card with the live profile, proxy, extension and history counts, and a centred
            column that stops growing at a readable width.

            Also in this build: browsers rows no longer overlap at 150% scaling, profile cards
            no longer push their tags under the action bar, the free plan cannot be coaxed
            into opening several browsers at once by fast clicking, the plan page no longer
            freezes on its first exchange-rate fetch, and turning off two-step code asks
            before it removes a protection.

            ### Notes

            The binaries are unsigned, so Windows may show "unknown publisher" the first time. A
            code signing certificate is the only thing that changes that line, and it is a yearly
            cost an individual developer carries. `SHA256.txt` is attached: compare the hash of
            the file you downloaded with the one in it.

            If Defender reports `JoeBrowserSetup.exe`, it is a false positive. It is a self
            contained installer carrying the application inside itself, a shape malware also
            uses, and a reputation engine reacts to that shape for a new publisher. The portable
            `JoeBrowser.exe` unpacks nothing and is the alternative.
      - name: Keep the binaries as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joebrowser-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: warn
