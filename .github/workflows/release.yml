name: Release

# Builds JoeBrowser.exe and JoeBrowserSetup.exe on a real Windows runner and publishes them.
#
# This exists because the EXE has to be produced by a Windows toolchain: the app is WinForms on
# .NET Framework 4.8 and links against the machine's GDI and Win32 APIs, so it cannot be
# cross-built honestly from a Linux container. Pushing a tag such as v1.3.0 runs this workflow,
# smoke-tests the binary it just made, and attaches both files to the release with the exact
# names the README links to (releases/latest/download/JoeBrowserSetup.exe).
#
# A push to master also builds and smoke-tests both binaries but publishes nothing, so a broken
# build is visible before a release tag is cut, and only a tag can create a release.

on:
  push:
    branches: [master, 'arena/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Read the version from the source
        id: ver
        shell: pwsh
        run: |
          # The one place the version is allowed to live is AssemblyInfo.cs; everything else
          # (asset names, release title, the tag check) is derived from it, so the two cannot
          # disagree at release time.
          $text = Get-Content src/AssemblyInfo.cs -Raw
          if ($text -notmatch 'AssemblyInformationalVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)') {
            throw 'Could not read AssemblyInformationalVersion from src/AssemblyInfo.cs'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Locate the SDK compiler
        id: csc
        shell: pwsh
        run: |
          # The repo builds with csc.exe directly (no project file, no NuGet), which is why the
          # build scripts take a -Csc path. The SDK ships Roslyn, so that path is satisfied here.
          $base = (& dotnet --info | Out-String)
          if ($base -notmatch 'Base Path:\s*(.+)') { throw 'Could not find the dotnet base path' }
          $roslyn = Join-Path $Matches[1].Trim() 'Roslyn\bincore\csc.dll'
          if (-not (Test-Path $roslyn)) { throw "No Roslyn compiler at $roslyn" }
          "path=$roslyn" >> $env:GITHUB_OUTPUT

          # Both build scripts take -Csc and invoke it as csc, so one forwarding wrapper is
          # created here and reused. It lives in RUNNER_TEMP and never reaches the repo.
          #
          # The SDK's Roslyn ships no csc.rsp, so a compile that passes no /r: switch resolves
          # nothing at all - not even System.Object - and fails with CS0518. The wrapper names
          # the framework assemblies explicitly, limited to the ones a WinForms app needs so
          # that type forwarding from 4.8 reference assemblies still lines up.
          $fw = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $refs = @('mscorlib.dll', 'System.dll', 'System.Core.dll', 'System.Drawing.dll',
                    'System.Windows.Forms.dll', 'System.Configuration.dll', 'System.Web.Extensions.dll',
                    'System.Security.dll', 'System.IO.Compression.dll',
                    'System.IO.Compression.FileSystem.dll') |
              ForEach-Object { Join-Path $fw $_ } |
              Where-Object { Test-Path $_ } |
              ForEach-Object { "/r:`"$_`"" }
          $wrapper = Join-Path $env:RUNNER_TEMP 'csc.cmd'
          $body = "@echo off`r`ndotnet `"$roslyn`" $($refs -join ' ') %*"
          Set-Content -Path $wrapper -Value $body -Encoding ASCII
          Write-Host "Wrapper: $body"
          "wrapper=$wrapper" >> $env:GITHUB_OUTPUT
          Write-Host "Compiler: $roslyn"

      - name: Smoke-test the compiler
        shell: pwsh
        run: |
          # Compiles a three-line program through the same wrapper the build uses, so a broken
          # wrapper, a missing dotnet or a missing reference assembly is reported here instead
          # of as an unexplained failure halfway through the real build.
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'probe') | Out-Null
          $probe = Join-Path $env:RUNNER_TEMP 'probe\probe.cs'
          'class P { static void Main() { } }' | Set-Content -Path $probe -Encoding ASCII
          $exe = Join-Path $env:RUNNER_TEMP 'probe\probe.exe'
          & '${{ steps.csc.outputs.wrapper }}' /nologo /target:exe /out:$exe $probe
          if ($LASTEXITCODE -ne 0) { throw "The SDK compiler could not build a trivial program (exit $LASTEXITCODE)" }
          if (-not (Test-Path $exe)) { throw "The SDK compiler reported success but produced no output" }
          Write-Host "Compiler smoke test passed: $((Get-Item $exe).Length) bytes"

      - name: Build JoeBrowser.exe
        shell: pwsh
        run: |
          # Wrapped so that a compiler error becomes a readable annotation rather than a bare
          # exit code 1. build.ps1 drives csc directly; the wrapper forwards to the SDK's Roslyn.
          .\.github\workflows\run-step.ps1 -Script build\build.ps1 -ScriptArgs @('-Csc', '${{ steps.csc.outputs.wrapper }}')

      - name: Build JoeBrowserSetup.exe
        shell: pwsh
        run: |
          # setup.ps1 takes the same -Csc parameter, so nothing has to be written into the repo.
          .\.github\workflows\run-step.ps1 -Script build\setup.ps1 -ScriptArgs @('-Csc', '${{ steps.csc.outputs.wrapper }}')

      - name: Verify the binaries
        shell: pwsh
        run: |
          # Routed through run-step.ps1 so that whatever this check prints on the way to failing
          # becomes a readable annotation: the raw log is not reachable from here.
          ./.github/workflows/run-step.ps1 -Script .github/workflows/verify-binaries.ps1 -ScriptArgs @('-Version', '${{ steps.ver.outputs.version }}')

      - name: Install, run and remove the installer's result
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Only on a tag: this writes to the runner's profile and registry, and it is the last
          # thing worth proving before a release goes out. Branches keep to the cheaper checks.
          ./.github/workflows/run-step.ps1 -Script .github/workflows/install-test.ps1 -ScriptArgs @('-Version', '${{ steps.ver.outputs.version }}')

      - name: Stage the release assets
        shell: pwsh
        run: |
          # Flat, predictable asset names: the README links to releases/latest/download/<name>,
          # so a renamed asset silently breaks every download link on the page.
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item 'dist\JoeBrowser.exe'      'out\JoeBrowser.exe'      -Force
          Copy-Item 'dist\JoeBrowserSetup.exe' 'out\JoeBrowserSetup.exe' -Force
          # The configuration travels with the portable EXE. It is what carries the DPI
          # settings, and it is the file the self test parses - a portable copy that was
          # downloaded on its own used to fail that check and to lose its per-monitor
          # scaling. The installer puts the same file next to the EXE it installs.
          Copy-Item 'dist\JoeBrowser.exe.config' 'out\JoeBrowser.exe.config' -Force
          # Both files are listed: someone who downloads the portable JoeBrowser.exe has the
          # same reason to verify it as someone who runs the installer.
          $lines = foreach ($n in @('JoeBrowser.exe', 'JoeBrowserSetup.exe', 'JoeBrowser.exe.config')) {
            $h = Get-FileHash (Join-Path 'out' $n) -Algorithm SHA256
            "$($h.Hash.ToLower())  $n"
          }
          $lines | Set-Content 'out\SHA256.txt' -Encoding ASCII
          Get-Content 'out\SHA256.txt'
          Get-ChildItem out | Format-Table Name, Length

      - name: Check the tag matches the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne '${{ steps.ver.outputs.tag }}') {
            throw "Tag ${{ github.ref_name }} does not match the version in AssemblyInfo.cs (${{ steps.ver.outputs.version }}). Bump the source, or move the tag."
          }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: Joe Browser ${{ steps.ver.outputs.version }} (Windows)
          tag_name: ${{ github.ref_name }}
          files: |
            out/JoeBrowser.exe
            out/JoeBrowserSetup.exe
            out/JoeBrowser.exe.config
            out/SHA256.txt
          body: |
            ## Joe Browser ${{ steps.ver.outputs.version }}

            **Download and run `JoeBrowserSetup.exe`.** Windows 10 or 11, 64 bit. The installer
            is per user, so there is no administrator prompt and nothing is written outside your
            profile. `JoeBrowser.exe` is the same app as one portable file: run it with
            `--portable` if you would rather not install.

            ### In this build

            **The window no longer lies about what it is running.** A pre-release build is a
            build the fingerprint sites have never seen, and a version that does not exist is
            the one input every one of those sites agrees reads as a mask: browserscan answered
            a Canary with "WebGL exception -5%" and pixelscan answered it with "Masking detected",
            while 157.0.8103.x scores a clean sweep on both. The application now claims the
            newest release the fingerprint sites know for any profile that runs a newer build -
            the user agent, the client hints, the brands and the GREASE token all say the same
            thing - and a pinned kernel still reports the binary it is. Stored profiles are
            repaired on load.

            **Existing profiles stopped claiming cards the machine does not have.** The store
            kept whatever GPU the pool rolled for the profile, whatever the machine really had:
            the renderer named one adapter and the limits came from another, visible without a
            database of anything. The claim is repaired on load and again at launch - to the
            adapter this PC actually has - so the fingerprint matches what a real browser on
            the machine would answer.

            **The Tools page paints what it says.** The action pill moved with the scroll and
            its label stayed behind - "Report it" printed underneath its own card with the pill
            empty. The page also did not take focus on any click, so the mouse wheel scrolled
            nothing at all. The buttons now follow the scroll, the page takes focus anywhere,
            and the wheel moves every page under the pointer, focused or not.

            **The report dialog is a dialog again.** The subtitle wrapped into the line beneath
            it and painted over what it was supposed to say; the status note and the two
            buttons shared a row with overlapping boxes. One fixed line per row now.

            **Pre-release is now called out where it matters.** The Browsers page says it, and
            the launch toast says it: a profile opened on a Canary is opened with the knowledge
            that the fingerprint sites flag builds they do not know yet. Install a Stable build
            from the Browsers page and pin the profile to it - or let the next profile default
            to it.

            One honest note on browserscan: its WebGL exception is intermittent on repeat visits
            to the same fingerprint - 95% or 100% on identical input - and it is not a defect
            of the profile. iphey, ipfighter and pixelscan pass consistently.

            ### What was in 1.13.1

            **The window comes back whole.** A window that was covered - or that was on
            another monitor and came back - is repainted by Windows region by region, and a
            user who looks at it in that moment sees a half drawn window: a button whose shape
            is there and whose text is stretched, a card that is a stripe, a caption bar in
            the old colour. The whole tree is now frozen, marked dirty and thawed, and the
            paint is done in one pass.

            ### What was in 1.13.0

            **The fingerprint no longer reads as masked.** BrowserScan scored the app at 90%
            with a "WebGL exception" and a "Canvas Tampering"; it now scores **100%**, and
            iphey reports the identity as trustworthy with everything fine. Four things were
            wrong, and each of them was one line of a lie:

            - *The graphics card.* The profile claimed a card the machine does not have. The
              renderer named one GPU and the limits that came with it came from another, and
              that is visible without a database of anything. The application now reads the
              adapter the machine really has - out of the browser it launches - and answers
              with it. There is a one-click "use this PC's graphics card" in the editor too.
            - *The version.* The profile claimed Chrome 157 while it ran Chromium 160, and
              the client hints - the GREASE brand above all - are a property of the binary
              that is running. A profile now reports the build it actually runs.
            - *The patched methods.* The replaced WebGL and canvas functions printed their
              argument names, and a native WebIDL method never does. They printed the wrong
              shape, and they were not enumerable, where the real ones are. Both are now
              exactly what the browser prints.
            - *The canvas.* A canvas that differs from this PC's is read as a modified
              canvas, so the noise is off by default. The switch is still there, one click
              away, and what it costs and what it buys is written under it.

            **A pre-release engine is called out.** A Canary build reports a version the
            fingerprint sites have never seen, and a version they do not know is read as a
            mask. The default engine is now the newest stable build, and the Browsers page
            says so when the build that is installed is a pre-release.

            **The two extensions come from the Chrome Web Store.** "HTTP Tracker Plus" and
            "Absolute Enable Right Click & Copy" are fetched from the store - the real
            listings - installed by default for a new profile, and removable. They are no
            longer written by the application. Only **paste as human** and the **proxy
            rotation and offline alerts** are built in, and both work on their own: the
            human-paste extension carries the typing engine, so Ctrl+V types the text with
            human timing instead of dropping it in at once, in any browser that loads it.

            **The window comes back the way it is.** A window that was covered could keep the
            pixels of wherever it was. The page is laid out again and the window is
            repainted as one piece when it comes to the front.

            **The history page does not freeze the application.** Reading the history took the
            better part of a second on a busy profile, on the thread that draws. It is read
            on a worker now: the page arrives in 92 ms instead of 721 ms.

            ### What was in 1.11.1

            **Opening a profile's menu no longer takes the window down.** The menu was given
            a rounded window region, and a region is built in logical pixels and converted
            with the control's own graphics - on a screen that is not at 100% the two do not
            agree, and the conversion throws "Parameter is not valid". The first profile menu
            opened on a scaled display closed the application.

            **Paste as human is the extension's job, and it works on its own.** It used to be
            a bridge: the extension forwarded its menu entry to the script the application
            injects, so in any browser the application did not launch it did nothing at all.
            The extension now carries the typing engine, and it replaces the plain paste -
            Ctrl+V types the text with human timing instead of dropping it in at once. Where
            the application also injects the feature, the two share a marker on the document
            so the text is typed once, not twice.

            **"Absolute Enable Right Click and Copy" does the work itself.** It restores the
            context menu, the copy and the selection by itself, and "HTTP Tracker Plus" has a
            badge on the page that counts the requests and the trackers.

            **The proxy alerts follow the proxy.** A profile created without a proxy had the
            watch switched off, and adding a proxy later left it off - so the rotation and
            offline alerts never fired on exactly the profiles they matter for. Choosing a
            proxy turns the watch on, and the application announces a rotation, a proxy that
            stopped answering and a proxy that came back.

            **The window is not scaled twice.** The application scales every measurement
            itself, and WinForms was scaling the controls as well. On a screen that is not at
            100% every size was doubled, and the interface looked broken rather than scaled.

            **Less, and quicker.** A new profile asks for four things - name, browser, browser
            build and group - and the rest is one click away. The profile menu went from nine
            entries to six, and the Tools page keeps two switches. The toast is as wide as its
            message, the switch is a switch, and the theme change takes a quarter of the time
            it did.

            **The About page stops shaking.** The page measured its own height while it
            painted, and the scroll host put it straight back to the height of the window, so
            the two fought over it for as long as the page was open. The height is measured in
            the paint and applied from outside it, and the page now sits still.

            **The theme change is one step, and it is instant.** The dissolve between a light
            theme and a dark one has to pass through the grey in the middle, where the text and
            the background are the same colour and the interface reads as broken - and it took
            long enough to be felt as a delay. The palette now moves in one step and the whole
            tree is repainted as one piece: no frame ever holds two themes, and no frame is
            unreadable. Every child window is held still while the tree is restyled, so nothing
            repaints on its own.

            **The page title has a row of its own.** On a narrow window the toolbar took the
            whole header band and the title was drawn underneath the search field, so the page
            had no name at all. The toolbar drops to a second row instead, and the title keeps
            the first one.

            **The Browsers page is shorter, and it lists more.** The rows said what they did not
            need to say. Chrome now reaches back twelve majors with four builds of each,
            Chromium offers eight to forty builds per channel, and Brave and Edge carry their
            real catalogues - Brave from its release feed, Edge from the enterprise download page
            Microsoft publishes. Both of the endpoints that used to answer for them are gone, and
            the page does not say "not found" any more.

            **Two extensions are included, and they are written by the application.**
            "HTTP Tracker Plus" and "Absolute Enable Right Click and Copy" are part of the
            build rather than a download, so they are there on the first run, behind a proxy that
            blocks the store, and offline. They load in every Chromium profile, Edge included.
            Removing one keeps it removed: the mark outlives the folder and survives a
            re-download, and the self test restores the state it found instead of leaving the
            first of the pair marked as removed on every machine that ran it.

            **The Account page fills the window.** It used to centre a 980 px column in whatever
            space there was, which left a wide empty margin on both sides of every card.
            "No other accounts on this PC" is gone: the absence of a list already says it.

            **The Extensions page does not overlap.** The button that restores the included pair
            and the heading above the recommended cards were laid out on top of each other.

            **Proxy rotation is announced by the application.** The rotation notice used to live
            only in a banner inside a page, which is not a notification when the user is looking
            somewhere else. The window now watches the address the world sees the profile from
            and says so in the window and in the notification area. The offline alert was
            already there.

            **Paste as human, the proxy watch and the right-click tool are built in.** They are
            written by the application and injected through the browser's own debugging channel,
            so they work on every Chromium engine without the user installing anything.

            **The Workspace and System headings are navigable.** They are headings and controls
            at once: clicking one goes to that group, and the group on screen is marked in the
            accent colour with a rule under it, so the rail says which half of the workspace you
            are in.

            ### Notes

            The binaries are unsigned, so Windows may show "unknown publisher" the first time. A
            code signing certificate is the only thing that changes that line, and it is a yearly
            cost an individual developer carries. `SHA256.txt` is attached: compare the hash of
            the file you downloaded with the one in it.

            If Defender reports `JoeBrowserSetup.exe`, it is a false positive. It is a self
            contained installer carrying the application inside itself, a shape malware also
            uses, and a reputation engine reacts to that shape for a new publisher. The portable
            `JoeBrowser.exe` unpacks nothing and is the alternative.
      - name: Keep the binaries as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joebrowser-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: warn
